<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Evog Acortador</title>

<style>

:root{
    --bg:#0d1117;
    --card:#161b22;
    --text:#ffffff;
    --border:#30363d;
    --primary:#ff2e63;
    --secondary:#8b949e;
    --success:#238636;
}

body.light{
    --bg:#f5f5f5;
    --card:#ffffff;
    --text:#111111;
    --border:#d0d7de;
    --primary:#ff2e63;
    --secondary:#555;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:20px;
    transition:.3s;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 20px rgba(0,0,0,.25);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo h1{
    color:var(--primary);
    font-size:30px;
}

.theme-btn{
    border:none;
    background:var(--primary);
    color:white;
    padding:12px 15px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
}

input{
    width:100%;
    padding:15px;
    border-radius:14px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    outline:none;
    font-size:15px;
    margin-top:12px;
}

.main-btn{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:14px;
    background:var(--primary);
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.main-btn:hover{
    opacity:.9;
}

.copy-btn{
    background:var(--success);
}

.detect{
    margin-top:15px;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.03);
}

.tag{
    display:inline-block;
    margin-top:8px;
    padding:6px 12px;
    border-radius:30px;
    background:var(--primary);
    color:white;
    font-size:13px;
}

.loading{
    display:none;
    margin-top:15px;
    text-align:center;
    color:var(--secondary);
}

.result{
    display:none;
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.03);
}

.result p{
    margin:10px 0;
    word-break:break-all;
}

.result a{
    color:#58a6ff;
}

.history{
    margin-top:30px;
}

.history h2{
    margin-bottom:15px;
}

.history-item{
    border:1px solid var(--border);
    background:rgba(255,255,255,.03);
    padding:15px;
    border-radius:15px;
    margin-bottom:12px;
}

.history-item p{
    margin:8px 0;
    word-break:break-all;
}

.history-item a{
    color:#58a6ff;
    text-decoration:none;
}

.empty{
    text-align:center;
    color:var(--secondary);
    padding:20px;
}

.timer{
    color:#ffcc00;
    font-weight:bold;
}

.password-badge{
    display:inline-block;
    margin-top:6px;
    padding:6px 10px;
    border-radius:30px;
    background:#ff9500;
    color:white;
    font-size:12px;
}

/* ================= LOCK SCREEN ================= */

.lock-screen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(8px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
}

.lock-box{
    width:100%;
    max-width:400px;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:20px;
    padding:30px;
    text-align:center;
}

.lock-box h2{
    color:#ff2e63;
    margin-bottom:10px;
}

.lock-box p{
    color:#8b949e;
    margin-bottom:20px;
}

.lock-box input{
    background:#0d1117;
    color:white;
}

.lock-box button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#ff2e63;
    color:white;
    font-size:15px;
    cursor:pointer;
    font-weight:bold;
    margin-top:10px;
}

#unlockStatus{
    margin-top:15px;
    color:#ffcc00;
}

</style>
</head>
<body>

<div class="container">

<div class="card">

<div class="header">

<div class="logo">
<h1>⚡ Evog Acortador</h1>
</div>

<button class="theme-btn" onclick="toggleTheme()">
🌙 / ☀️
</button>

</div>

<input 
type="text" 
id="urlInput"
placeholder="Pega cualquier enlace..."
>

<input
type="password"
id="passwordInput"
placeholder="🔐 Contraseña opcional"
>

<button class="main-btn" onclick="shortenUrl()">
🚀 Acortar Link
</button>

<div class="detect" id="detectBox">
🔍 Esperando enlace...
</div>

<div class="loading" id="loading">
⏳ Acortando enlace...
</div>

<div class="result" id="result">

<h3>✅ Link Acortado</h3>

<p>
<strong>🔗 URL Corta:</strong><br>
<a id="shortUrl" href="#" target="_blank"></a>
</p>

<p>
<strong>📌 Original:</strong><br>
<span id="originalUrl"></span>
</p>

<p>
<strong>📂 Tipo Detectado:</strong><br>
<span id="detectedType"></span>
</p>

<p id="passwordView"></p>

<button class="main-btn copy-btn" onclick="copyLink()">
📋 Copiar Link
</button>

</div>

</div>

<div class="history">

<h2>📊 Historial (24H)</h2>

<div id="historyList"></div>

</div>

</div>

<!-- ================= LOCK SCREEN ================= -->

<div class="lock-screen" id="lockScreen">

<div class="lock-box">

<h2>🔐 LINK PROTEGIDO</h2>

<p>
Ingresa contraseña
</p>

<input
type="password"
id="unlockPassword"
placeholder="********"
>

<button onclick="unlockLink()">
🔓 DESBLOQUEAR
</button>

<div id="unlockStatus"></div>

</div>

</div>

<script>

// ================= THEME =================

function toggleTheme(){

    document.body.classList.toggle("light");

    const mode =
    document.body.classList.contains("light")
    ? "light"
    : "dark";

    localStorage.setItem("theme", mode);

}

(function(){

    const savedTheme =
    localStorage.getItem("theme");

    if(savedTheme === "light"){
        document.body.classList.add("light");
    }

})();

// ================= DETECTOR =================

const input =
document.getElementById("urlInput");

const detectBox =
document.getElementById("detectBox");

input.addEventListener("input", () => {

    const url =
    input.value.toLowerCase();

    let type = "🌍 Sitio Web";

    if(url.includes("youtube")
    || url.includes("youtu.be")){
        type = "📺 YouTube";
    }

    else if(url.includes("tiktok")){
        type = "🎵 TikTok";
    }

    else if(url.includes("facebook")
    || url.includes("fb")){
        type = "📘 Facebook";
    }

    else if(url.includes("instagram")){
        type = "📸 Instagram";
    }

    else if(url.includes("whatsapp")){
        type = "💬 WhatsApp";
    }

    else if(url.includes("x.com")
    || url.includes("twitter")){
        type = "🐦 X / Twitter";
    }

    else if(url.includes("telegram")){
        type = "✈️ Telegram";
    }

    else if(url.includes("github")){
        type = "💻 GitHub";
    }

    detectBox.innerHTML = `
        🔍 Detectado:
        <div class="tag">${type}</div>
    `;

});

// ================= SHORTENER =================

async function shortenUrl(){

    const url =
    input.value.trim();

    const password =
    document
    .getElementById("passwordInput")
    .value
    .trim();

    if(!url || !url.startsWith("http")){
        alert("⚠️ Ingresa un enlace válido");
        return;
    }

    if(password.length > 20){
        alert("⚠️ Máximo 20 caracteres");
        return;
    }

    const loading =
    document.getElementById("loading");

    const result =
    document.getElementById("result");

    loading.style.display = "block";
    result.style.display = "none";

    try{

        const api = atob(
        "aHR0cHM6Ly9hcGkuZXZvZ2Iub3JnL3Rvb2xzL3Nob3J0bGluaw=="
        );

        const key =
        atob("c2FzdWtl");

        const response =
        await fetch(
        `${api}?url=${encodeURIComponent(url)}&key=${key}`
        );

        const data =
        await response.json();

        loading.style.display = "none";

        if(!data.status){
            alert("❌ Error al acortar");
            return;
        }

        document.getElementById(
        "shortUrl"
        ).innerText = data.shorturl;

        document.getElementById(
        "shortUrl"
        ).href = data.shorturl;

        document.getElementById(
        "originalUrl"
        ).innerText = data.original;

        document.getElementById(
        "detectedType"
        ).innerText =
        detectBox.innerText.replace(
        "🔍 Detectado:",
        ""
        ).trim();

        const passwordView =
        document.getElementById(
        "passwordView"
        );

        if(password){

            passwordView.innerHTML = `
                <strong>🔐 Contraseña:</strong><br>
                <span class="password-badge">
                    ${password}
                </span>
            `;

        }else{

            passwordView.innerHTML = "";

        }

        result.style.display = "block";

        saveHistory(
            data.shorturl,
            data.original,
            password
        );

    }catch(err){

        loading.style.display = "none";

        alert("❌ Error del servidor");

    }

}

// ================= COPY =================

function copyLink(){

    const text =
    document.getElementById(
    "shortUrl"
    ).innerText;

    navigator.clipboard.writeText(text);

    alert("✅ Link copiado");

}

// ================= HISTORY =================

const HISTORY_TIME =
24 * 60 * 60 * 1000;

function saveHistory(
shortUrl,
original,
password
){

    let history =
    JSON.parse(
    localStorage.getItem("history")
    ) || [];

    history.unshift({
        shortUrl,
        original,
        password,
        createdAt: Date.now()
    });

    localStorage.setItem(
    "history",
    JSON.stringify(history)
    );

    renderHistory();

}

function renderHistory(){

    const historyList =
    document.getElementById(
    "historyList"
    );

    let history =
    JSON.parse(
    localStorage.getItem("history")
    ) || [];

    history = history.filter(item => {

        const now = Date.now();

        return (
        now - item.createdAt
        ) < HISTORY_TIME;

    });

    localStorage.setItem(
    "history",
    JSON.stringify(history)
    );

    if(history.length === 0){

        historyList.innerHTML = `
        <div class="empty">
            No hay historial todavía
        </div>
        `;

        return;

    }

    historyList.innerHTML = "";

    history.forEach(item => {

        historyList.innerHTML += `
        
        <div class="history-item">

            <p>
                <strong>🔗 Link:</strong><br>

                ${
                item.password
                ? `
                <a href="javascript:void(0)"
                onclick="openProtectedLink(
                '${item.shortUrl}',
                '${item.password}'
                )">
                🔐 Abrir Link Protegido
                </a>
                `
                : `
                <a href="${item.shortUrl}"
                target="_blank">
                ${item.shortUrl}
                </a>
                `
                }

            </p>

            <p>
                <strong>📌 Original:</strong><br>
                ${item.original}
            </p>

            ${
            item.password
            ? `
            <p>
                <strong>🔐 Contraseña:</strong><br>
                <span class="password-badge">
                    ${item.password}
                </span>
            </p>
            `
            : ""
            }

            <p class="timer">
                🕒 Se borra en:
                ${getRemainingTime(
                item.createdAt
                )}
            </p>

        </div>

        `;

    });

}

// ================= TIMER =================

function getRemainingTime(createdAt){

    const now = Date.now();

    const expire =
    createdAt + HISTORY_TIME;

    let diff =
    expire - now;

    if(diff <= 0){
        return "Expirado";
    }

    const hours =
    Math.floor(
    diff / (1000 * 60 * 60)
    );

    diff %= (
    1000 * 60 * 60
    );

    const minutes =
    Math.floor(
    diff / (1000 * 60)
    );

    diff %= (
    1000 * 60
    );

    const seconds =
    Math.floor(
    diff / 1000
    );

    return `
    ${hours}h
    ${minutes}m
    ${seconds}s
    `;

}

// ================= LOCK SYSTEM =================

let currentProtectedLink = "";
let currentPassword = "";

function openProtectedLink(
url,
password
){

    currentProtectedLink = url;
    currentPassword = password;

    document.getElementById(
    "lockScreen"
    ).style.display = "flex";

}

function unlockLink(){

    const input =
    document
    .getElementById(
    "unlockPassword"
    )
    .value
    .trim();

    const status =
    document.getElementById(
    "unlockStatus"
    );

    if(input === currentPassword){

        status.innerHTML =
        "✅ Acceso concedido...";

        setTimeout(() => {

            window.open(
            currentProtectedLink,
            "_blank"
            );

            document.getElementById(
            "lockScreen"
            ).style.display = "none";

            document.getElementById(
            "unlockPassword"
            ).value = "";

            status.innerHTML = "";

        }, 1000);

    }else{

        status.innerHTML =
        "❌ Contraseña incorrecta";

    }

}

// ================= AUTO UPDATE =================

setInterval(() => {

    renderHistory();

}, 1000);

// ================= INIT =================

renderHistory();

</script>

</body>
</html>
